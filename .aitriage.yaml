# AITriage — конфиг security-скана для ЭТОГО проекта (override-точка).
# По умолчанию инструмент сам детектит стек и набор правил — правьте только
# при необходимости. Политику гейтинга (блокирует / не блокирует PR) задаёт
# центральный workflow, а НЕ этот файл.

ignore:
  # Пути, которые не сканируем (сторонний код, артефакты сборки).
  paths:
    - vendor/
    - node_modules/
    - dist/
    - .git/
  # rules: []        # подавить конкретные правила по ID (если ложные срабатывания)

health_check:
  profile: baseline  # baseline | standard | strict

# stack: nextjs      # раскомментируйте, чтобы форснуть стек вместо авто-детекта
