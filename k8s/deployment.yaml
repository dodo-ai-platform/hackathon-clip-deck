# TODO: Replace "myapp" with your app name, update image and env vars.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the project ResourceQuota has no headroom for a surge pod.
  # Rationale + zero-downtime opt-out: dap-shipmaster/references/manifest-rules.md (rule 7).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/dodo-ai-platform/REPO_NAME:IMAGE_TAG
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "alloy.infra-alloy.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "myapp"
          # Uncomment if database is enabled in your Project CR:
          # envFrom:
          #   - secretRef:
          #       name: PROJECTNAME-db-credentials
          # Uncomment if mongodb is enabled in your Project CR:
          #   - secretRef:
          #       name: PROJECTNAME-mongodb-credentials
          # Uncomment if redis is enabled in your Project CR:
          #   - secretRef:
          #       name: PROJECTNAME-redis-credentials
          # Uncomment if bucket is enabled in your Project CR:
          #   - secretRef:
          #       name: PROJECTNAME-bucket-credentials
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
